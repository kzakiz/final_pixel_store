<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Pixel Store</title>

    <link rel="stylesheet" href="css/olvidar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">

                <i class="fa-solid fa-gamepad"></i>

                <h2>Pixel Store</h2>

            </div>

            <h1>¿Olvidaste tu contraseña?</h1>

            <p>

                Ingresa el correo electrónico asociado a tu cuenta y te
                enviaremos un enlace para restablecer tu contraseña.

            </p>

            <form>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email" placeholder="Correo electrónico" required>

                </div>

                <button class="login-btn">

                    Enviar enlace de recuperación

                </button>

            </form>

            <div class="register">

                <p>¿Recordaste tu contraseña?</p>

                <a href="html/iniciar.html">

                    Volver a iniciar sesión

                </a>

            </div>

        </div>

    </div>

</body>

</html>
